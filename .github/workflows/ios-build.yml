name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: Build iOS framework
        run: |
          ./gradlew :app:linkDebugFrameworkIosArm64 \
            -Pkotlin.native.cacheKind.iosArm64=none \
            --no-daemon

      - name: Set up Xcode project
        run: |
          mkdir -p iosApp/build
          # Copy framework to Xcode-friendly location
          cp -r app/build/bin/iosArm64/debugFramework/shared.framework \
            iosApp/build/

      - name: Build and sign IPA
        run: |
          cd iosApp
          # Create app bundle structure
          mkdir -p build/Payload
          cp -r build/shared.framework build/Payload/
          # Create minimal IPA (placeholder — real Xcode project needed for full IPA)
          cd build && zip -r CirclePopper.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CirclePopper.ipa
          path: iosApp/build/CirclePopper.ipa
