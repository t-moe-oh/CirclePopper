name: Build iOS IPA

"on":
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: Build iOS framework
        run: |
          ./gradlew :app:linkDebugFrameworkIosArm64 \
            -Pkotlin.native.cacheKind.iosArm64=none \
            --no-daemon

      - name: Build IPA
        run: |
          FW="app/build/bin/iosArm64/debugFramework/shared.framework"
          APP="build/CirclePopper.app"

          mkdir -p "$APP/Frameworks"
          cp -r "$FW" "$APP/Frameworks/"
          cp iosApp/iosApp/Info.plist "$APP/"

          xcrun -sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -fobjc-arc \
            -fmodules \
            -F "$APP/Frameworks" \
            -framework shared \
            -framework UIKit \
            -o "$APP/CirclePopper" \
            iosApp/iosApp/main.m

          codesign -s - "$APP/Frameworks/shared.framework"
          codesign -s - "$APP"

          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build && zip -r CirclePopper.ipa Payload/ -x "*.DS_Store"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CirclePopper.ipa
          path: build/CirclePopper.ipa
